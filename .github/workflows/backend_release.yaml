name: Backend Release CICD
run-name: release backend (${{ inputs.bump }}) and deploy to cloud run
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: install cargo
        uses: dtolnay/rust-toolchain@stable
      - name: Run clippy
        run: cargo clippy
        working-directory: backend
      - name: Run rustfmt
        run: cargo fmt -- --check
        working-directory: backend
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: install cargo
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cd backend && SQLX_OFFLINE=true cargo test --workspace
  release:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: bump
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'backend-v*' | sed 's/^backend-v//' | sort -V | tail -1)
          latest=${latest:-0.0.0}
          IFS='.' read -r major minor patch <<< "$latest"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=backend-v${version}" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes
  build:
    runs-on: ubuntu-latest
    needs: [release]
    environment:
      name: google_cloud_prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup GCP credentials
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_EDITOR }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_PROD_EDITOR }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            asia-northeast1-docker.pkg.dev/nawawan/nawawan-prod-repository/nawawan-playground:${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
